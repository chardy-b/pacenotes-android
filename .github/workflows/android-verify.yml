name: Android verification

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: Gradle task to run
        required: false
        default: ":app:testDebugUnitTest"
      run_instrumentation:
        description: Run connected Android instrumentation tests in a GitHub-hosted emulator
        required: false
        type: boolean
        default: false
      publish_phone_test_release:
        description: Publish the verified debug APK as a GitHub prerelease asset
        required: false
        type: boolean
        default: false
  push:
    branches:
      - teo/wil-70-p0-13-hosted-openfreemap-mvp
    paths:
      - "app/**"
      - "core-model/**"
      - "pacenotes/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-verify.yml"

permissions:
  actions: read
  contents: write

jobs:
  verify:
    name: ${{ inputs.gradle_task || ':app:testDebugUnitTest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android Gradle verification
        run: ./gradlew --no-daemon --stacktrace ${{ inputs.gradle_task || ':app:testDebugUnitTest' }}

  instrumentation:
    name: connected Android instrumentation tests
    needs: verify
    if: ${{ inputs.run_instrumentation == true && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 900
          cores: 4
          script: >-
            ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest &&
            adb devices -l &&
            adb install -r app/build/outputs/apk/debug/app-debug.apk &&
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk &&
            adb shell pm grant com.rich.rallypacenotes android.permission.ACCESS_FINE_LOCATION &&
            adb shell pm grant com.rich.rallypacenotes android.permission.ACCESS_COARSE_LOCATION &&
            adb emu geo fix -122.4194 37.7749 &&
            { instrumentation_exit=0; adb shell am instrument -w -r com.rich.rallypacenotes.test/androidx.test.runner.AndroidJUnitRunner > instrumentation-output.txt || instrumentation_exit=$?; cat instrumentation-output.txt; adb logcat -d -t 500 > device-logcat.txt; test "$instrumentation_exit" -eq 0; ! grep -q "FAILURES!!!" instrumentation-output.txt; grep -q "OK (" instrumentation-output.txt; } &&
            adb shell am force-stop com.rich.rallypacenotes &&
            adb shell am start -W -n com.rich.rallypacenotes/.MainActivity &&
            ready=0 && for attempt in $(seq 1 60); do if adb logcat -d -v brief HostedMapView:I '*:S' | grep -q 'Hosted map render completed'; then ready=1; break; fi; sleep 1; done &&
            if [ "$ready" -ne 1 ]; then echo 'Timed out waiting for hosted MapLibre render readiness' >&2; adb logcat -d -v threadtime > device-logcat.txt; exit 1; fi &&
            adb emu geo fix -122.4194 37.7749 &&
            sleep 3 &&
            adb shell dumpsys location > location-state.txt &&
            adb shell pidof com.rich.rallypacenotes &&
            adb exec-out screencap -p > hosted-map.png &&
            app_pid=$(adb shell pidof com.rich.rallypacenotes) &&
            adb logcat -d -v threadtime --pid="$app_pid" > app-logcat.txt &&
            adb logcat -d -t 500 > device-logcat.txt
      - name: Upload instrumentation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/androidTests/
            instrumentation-output.txt
            hosted-map.png
            location-state.txt
            app-logcat.txt
            device-logcat.txt
          if-no-files-found: warn

  release-phone-test:
    name: publish verified phone-test APK
    needs: instrumentation
    if: ${{ inputs.publish_phone_test_release == true && needs.instrumentation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-instrumentation-reports
          path: release-artifact
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-test-${{ github.run_number }}
          name: Rally Pacenotes phone map-and-location test ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Verified phone-test build: the app loads the hosted OpenFreeMap Liberty basemap and shows the MapLibre current-location marker after runtime permission.

            Verification run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release-artifact/app/build/outputs/apk/debug/app-debug.apk
