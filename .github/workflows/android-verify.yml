name: Android verification

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: Gradle task to run
        required: false
        default: ":app:testDebugUnitTest"
      run_instrumentation:
        description: Run connected Android instrumentation tests in a GitHub-hosted emulator
        required: false
        type: boolean
        default: false
  push:
    branches:
      - teo/wil-17-p0-12-prove-offline-norcal-basemap
    paths:
      - "app/**"
      - "core-model/**"
      - "pacenotes/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-verify.yml"

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: ${{ inputs.gradle_task || ':app:testDebugUnitTest' }}
    if: ${{ inputs.run_instrumentation != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android Gradle verification
        run: ./gradlew --no-daemon --stacktrace ${{ inputs.gradle_task || ':app:testDebugUnitTest' }}

  instrumentation:
    name: connected Android instrumentation tests
    if: ${{ inputs.run_instrumentation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download and verify the NorCal offline map package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci/norcal-map
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9012191704/zip" \
            --output .ci/norcal-map.zip
          unzip -q .ci/norcal-map.zip -d .ci/norcal-map
          (cd .ci/norcal-map && sha256sum -c norcal.mbtiles.sha256)
      - name: Enable KVM acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 900
          script: >-
            ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest &&
            adb devices -l &&
            adb install -r app/build/outputs/apk/debug/app-debug.apk &&
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk &&
            adb push .ci/norcal-map/norcal.mbtiles /data/local/tmp/norcal.mbtiles &&
            adb shell run-as com.rich.rallypacenotes mkdir -p files/local-maps &&
            adb shell run-as com.rich.rallypacenotes cp /data/local/tmp/norcal.mbtiles files/local-maps/norcal.mbtiles &&
            adb shell run-as com.rich.rallypacenotes ls -l files/local-maps/norcal.mbtiles &&
            instrumentation_exit=0 &&
            adb shell am instrument -w -r com.rich.rallypacenotes.test/androidx.test.runner.AndroidJUnitRunner > instrumentation-output.txt || instrumentation_exit=$? &&
            cat instrumentation-output.txt &&
            adb logcat -d -t 500 > device-logcat.txt &&
            test "$instrumentation_exit" -eq 0 &&
            ! grep -q "FAILURES!!!" instrumentation-output.txt &&
            grep -q "OK (" instrumentation-output.txt &&
            adb shell am force-stop com.rich.rallypacenotes &&
            adb shell am start -W -n com.rich.rallypacenotes/.MainActivity &&
            sleep 5 &&
            adb shell pidof com.rich.rallypacenotes &&
            adb exec-out screencap -p > offline-map.png &&
            adb logcat -d -t 500 > device-logcat.txt
      - name: Upload instrumentation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            .ci/norcal-map/norcal.mbtiles
            .ci/norcal-map/norcal.mbtiles.sha256
            app/build/reports/androidTests/
            instrumentation-output.txt
            offline-map.png
            device-logcat.txt
          if-no-files-found: warn
