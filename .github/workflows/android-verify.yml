name: Android verification

on:
  workflow_dispatch:
    inputs:
      run_instrumentation:
        description: Run the emulator gate for a user-reviewable milestone or an Android device-specific change
        required: false
        type: boolean
        default: false
      publish_phone_test_release:
        description: Publish the candidate debug APK only after the captured emulator screenshot has been reviewed
        required: false
        type: boolean
        default: false
  push:
    branches:
      - teo/wil-70-p0-13-hosted-openfreemap-mvp
      - teo/wil-76-p0-16-navigation-camera-direction
    paths:
      - "app/**"
      - "core-model/**"
      - "pacenotes/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-verify.yml"

permissions:
  actions: read
  contents: write

# Keep only the newest verification for a ref; a later push supersedes an in-flight run.
concurrency:
  group: android-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM and app unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run all fast unit-test suites
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :core-model:test :pacenotes:test

  instrumentation:
    name: connected Android instrumentation tests
    needs: verify
    if: ${{ inputs.run_instrumentation == true && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 900
          cores: 2
          script: >-
            set -e; trap 'adb logcat -d -t 1000 > device-logcat.txt || true; app_pid=$(adb shell pidof com.rich.rallypacenotes || true); if [ -n "$app_pid" ]; then adb logcat -d -v threadtime --pid="$app_pid" > app-logcat.txt || true; fi' EXIT; ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest &&
            adb devices -l &&
            adb install -r app/build/outputs/apk/debug/app-debug.apk &&
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk &&
            adb shell pm revoke com.rich.rallypacenotes android.permission.ACCESS_FINE_LOCATION || true &&
            adb shell pm revoke com.rich.rallypacenotes android.permission.ACCESS_COARSE_LOCATION || true &&
            adb shell am force-stop com.google.android.googlesdksetup || true &&
            adb shell am force-stop com.rich.rallypacenotes &&
            adb shell am start -W -n com.rich.rallypacenotes/.MainActivity &&
            permission_dialog=0 && for attempt in $(seq 1 30); do adb shell uiautomator dump /sdcard/permission-window.xml >/dev/null && adb exec-out cat /sdcard/permission-window.xml > permission-window.xml && if grep -q 'While using the app' permission-window.xml; then permission_dialog=1; break; fi; if grep -q "com.google.android.googlesdksetup isn't responding" permission-window.xml; then close_bounds=$(python3 -c "import sys,xml.etree.ElementTree as E; node=next(n for n in E.parse(sys.argv[1]).iter('node') if n.attrib.get('text') == 'Close app'); print(*node.attrib['bounds'].replace('[', '').replace(']', ',').replace(',', ' ').split())" permission-window.xml) && set -- $close_bounds && adb shell input tap $((($1+$3)/2)) $((($2+$4)/2)); fi; sleep 1; done &&
            test "$permission_dialog" -eq 1 &&
            adb exec-out screencap -p > permission-request.png &&
            adb shell pm grant com.rich.rallypacenotes android.permission.ACCESS_FINE_LOCATION &&
            adb shell pm grant com.rich.rallypacenotes android.permission.ACCESS_COARSE_LOCATION &&
            { instrumentation_exit=0; adb shell am instrument -w -r -e class com.rich.rallypacenotes.ReplayAlphaAppInstrumentedTest com.rich.rallypacenotes.test/androidx.test.runner.AndroidJUnitRunner > instrumentation-output.txt || instrumentation_exit=$?; cat instrumentation-output.txt; adb logcat -d -t 500 > device-logcat.txt; test "$instrumentation_exit" -eq 0; ! grep -q "FAILURES!!!" instrumentation-output.txt; grep -q "OK (" instrumentation-output.txt; } &&
            adb logcat -c &&
            adb shell appops set com.rich.rallypacenotes.test android:mock_location allow &&
            adb shell appops set com.rich.rallypacenotes android:mock_location allow &&
            adb shell appops get com.rich.rallypacenotes.test android:mock_location | grep -q 'allow' &&
            adb shell appops get com.rich.rallypacenotes android:mock_location | grep -q 'allow' &&
            adb shell am instrument -w -r -e class com.rich.rallypacenotes.MendocinoGpsFixtureTest com.rich.rallypacenotes.test/androidx.test.runner.AndroidJUnitRunner > mendocino-fixture-output.txt &&
            cat mendocino-fixture-output.txt &&
            grep -q 'OK (1 test)' mendocino-fixture-output.txt &&
            adb shell am start -W -n com.rich.rallypacenotes/.MainActivity &&
            ready=0 && for attempt in $(seq 1 60); do if adb logcat -d -v brief HostedMapView:I '*:S' | grep -q 'Hosted map render completed'; then ready=1; break; fi; sleep 1; done &&
            if [ "$ready" -ne 1 ]; then echo 'Timed out waiting for hosted MapLibre render readiness' >&2; adb logcat -d -v threadtime > device-logcat.txt; exit 1; fi &&
            mendocino_fix=0 && for attempt in $(seq 1 20); do if adb logcat -d -v brief PlatformGpsLocationEngine:I '*:S' | grep -q 'GPS fix latitude=39\.3247.*speed=[1-9].*bearing=2[12](\.0)?'; then mendocino_fix=1; break; fi; sleep 1; done &&
            test "$mendocino_fix" -eq 1 &&
            navigation_camera=0 && for attempt in $(seq 1 20); do if adb logcat -d -v brief HostedMapView:I '*:S' | grep -q 'Camera request mode=NAVIGATION.*latitude=39\.3247.*pitch=50.0'; then navigation_camera=1; break; fi; sleep 1; done &&
            test "$navigation_camera" -eq 1 &&
            sleep 1 &&
            adb shell dumpsys location > location-state.txt &&
            grep -q 'Location\[gps 39\.3247' location-state.txt &&
            adb shell pidof com.rich.rallypacenotes &&
            adb exec-out screencap -p > navigation-map.png &&
            adb shell uiautomator dump /sdcard/app-window.xml >/dev/null &&
            adb exec-out cat /sdcard/app-window.xml > app-window.xml &&
            toggle_bounds=$(python3 -c "import sys,xml.etree.ElementTree as E; node=next(n for n in E.parse(sys.argv[1]).iter('node') if n.attrib.get('content-desc') == 'Switch to north-up map'); print(*node.attrib['bounds'].replace('[', '').replace(']', ',').replace(',', ' ').split())" app-window.xml) &&
            set -- $toggle_bounds && adb shell input tap $((($1+$3)/2)) $((($2+$4)/2)) &&
            north_up_control=0 && for attempt in $(seq 1 20); do adb shell uiautomator dump /sdcard/north-up-window.xml >/dev/null && adb exec-out cat /sdcard/north-up-window.xml > north-up-window.xml && if grep -q 'Switch to navigation view' north-up-window.xml; then north_up_control=1; break; fi; sleep 1; done &&
            test "$north_up_control" -eq 1 &&
            north_up_camera=0 && for attempt in $(seq 1 20); do if adb logcat -d -v brief HostedMapView:I '*:S' | grep -q 'Camera request mode=NORTH_UP.*bearing=0.0 pitch=0.0'; then north_up_camera=1; break; fi; sleep 1; done &&
            test "$north_up_camera" -eq 1 &&
            sleep 1 &&
            adb exec-out screencap -p > north-up-map.png &&
            app_pid=$(adb shell pidof com.rich.rallypacenotes) &&
            adb logcat -d -v threadtime --pid="$app_pid" > app-logcat.txt &&
            adb logcat -d -t 500 > device-logcat.txt
      - name: Upload instrumentation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/androidTests/
            instrumentation-output.txt
            mendocino-fixture-output.txt
            permission-request.png
            permission-window.xml
            navigation-map.png
            north-up-map.png
            app-window.xml
            north-up-window.xml
            location-state.txt
            app-logcat.txt
            device-logcat.txt
          if-no-files-found: warn
      - name: Record required screenshot-review checklist
        if: ${{ always() }}
        run: |
          {
            echo "## Required user-review evidence"
            echo
            echo "Before accepting this emulator run or publishing its APK, inspect \`navigation-map.png\` and \`north-up-map.png\` from \`android-instrumentation-reports\`."
            echo
            echo "- [ ] \`permission-request.png\` shows Android's initial location-permission dialog, not an in-app permission button."
            echo "- [ ] Both images show the app—not Android system UI—and Northern California basemap features rather than a blank style surface."
            echo "- [ ] Attribution and a clearly visible native current-location marker appear in both images."
            echo "- [ ] \`navigation-map.png\` shows the close, tilted, moving-location navigation camera and its visible direction indicator."
            echo "- [ ] \`north-up-map.png\` shows the same location with top-down north-up orientation after the semantic FAB toggle."
            echo "- [ ] Review \`app-window.xml\`, \`app-logcat.txt\`, and \`location-state.txt\` for the same run."
          } >> "$GITHUB_STEP_SUMMARY"

  release-phone-test:
    name: publish review-required phone-test APK
    needs: instrumentation
    if: ${{ inputs.publish_phone_test_release == true && needs.instrumentation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-instrumentation-reports
          path: release-artifact
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-test-${{ github.run_number }}
          name: Rally Pacenotes phone map-and-location test ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Review-required phone-test build. Before treating this APK as accepted or sharing it with a tester, inspect `hosted-map.png`, `app-logcat.txt`, and `location-state.txt` in the `android-instrumentation-reports` artifact from this exact run.

            Verification run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release-artifact/app/build/outputs/apk/debug/app-debug.apk
