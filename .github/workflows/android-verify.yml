name: Android verification

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: Gradle task to run
        required: false
        default: ":app:testDebugUnitTest"
      run_instrumentation:
        description: Run connected Android instrumentation tests in a GitHub-hosted emulator
        required: false
        type: boolean
        default: false
  push:
    branches:
      - teo/wil-17-p0-12-prove-offline-norcal-basemap
    paths:
      - "app/**"
      - "core-model/**"
      - "pacenotes/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.gradle_task || ':app:testDebugUnitTest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android Gradle verification
        run: ./gradlew --no-daemon --stacktrace ${{ inputs.gradle_task || ':app:testDebugUnitTest' }}

  instrumentation:
    name: connected Android instrumentation tests
    if: ${{ inputs.run_instrumentation == true }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 900
          script: >-
            ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest &&
            adb devices -l &&
            adb install -r app/build/outputs/apk/debug/app-debug.apk &&
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk &&
            adb shell am instrument -w -r com.rich.rallypacenotes.test/androidx.test.runner.AndroidJUnitRunner
      - name: Upload instrumentation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: app/build/reports/androidTests/
          if-no-files-found: warn
