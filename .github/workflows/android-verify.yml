name: Android verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_instrumentation:
        description: Run Android instrumentation tests on API 35
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:assembleDebug
          :app:testDebugUnitTest
          :core-model:test
          :pacenotes:test

  instrumentation:
    name: API 35 instrumentation tests
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_instrumentation == true && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 900
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
