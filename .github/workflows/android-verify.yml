name: Android verification

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: Gradle task to run
        required: false
        default: ":app:testDebugUnitTest"
  push:
    branches:
      - teo/wil-17-p0-12-prove-offline-norcal-basemap
    paths:
      - "app/**"
      - "core-model/**"
      - "pacenotes/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.gradle_task || ':app:testDebugUnitTest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android Gradle verification
        run: ./gradlew --no-daemon --stacktrace ${{ inputs.gradle_task || ':app:testDebugUnitTest' }}
